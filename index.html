<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Apex — AP Exam Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel=stylesheet>
<style>
:root{--bg:#f6f1e7;--ink:#1c1917;--mute:#6b645a;--card:#fffdf8;--line:#e2d9c8;--acc:#c2410c;--ok:#2f7d4f;--bad:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#171410;--ink:#f3ece0;--mute:#a69d8d;--card:#201c16;--line:#3a3328;--acc:#f08a4b;--ok:#6cc58d;--bad:#ff8a7a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:.2em 0 .5em}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;border-bottom:1px solid var(--line)}
.logo{font:700 22px Fraunces,serif;cursor:pointer}.logo i{color:var(--acc)}
main{display:grid;grid-template-columns:280px 1fr;max-width:1100px;margin:auto;gap:40px;padding:28px}
nav{position:sticky;top:20px;align-self:start;font-size:14px}
nav h4{margin:18px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
nav a{display:flex;gap:8px;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;cursor:pointer}
nav a:hover,nav a.on{background:var(--line)}nav a.soon{color:var(--mute);cursor:default}.dot{color:var(--ok);margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;margin:18px 0}
.eq{font:15px ui-monospace,monospace;background:var(--bg);border-left:3px solid var(--acc);padding:12px 16px;margin:12px 0}
canvas{width:100%;background:var(--bg);border-radius:8px}label{display:block;margin-top:10px;font-size:14px}input[type=range]{width:100%;accent-color:var(--acc)}
.out{font:14px ui-monospace,monospace;color:var(--acc)}
button{font:600 15px Inter;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:none;color:var(--ink);border:1px solid var(--line);margin:8px 0;font-weight:500}
.opt:hover{border-color:var(--acc)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.why{font-size:14px;color:var(--mute)}.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px}.bar div{height:100%;background:var(--acc);border-radius:4px}
@media(max-width:800px){main{grid-template-columns:1fr;padding:16px}nav{position:static}}
.in{animation:up .5s}@keyframes up{from{opacity:0;transform:translateY(14px)}}#go{position:sticky;bottom:18px;display:block;margin:14px auto;box-shadow:0 6px 20px #0004;background:var(--acc);color:#fff;padding:12px 26px;border-radius:99px}.card p,.card li{font-size:17px}</style></head><body>
<header><div class=logo onclick="location.hash=''">Apex<i>.</i></div><span id=pr style="font-size:14px;color:var(--mute)"></span></header>
<main><nav id=nav></nav><section id=view></section></main>
<script src=data.js></script><script src=demos.js></script><script src=unit1.js></script><script src=unit2.js></script><script src=demos2.js></script>
<script>
const C=COURSES[0],$=s=>document.querySelector(s);
let P={};try{P=JSON.parse(localStorage.ap1||'{}')}catch(e){}
const save=(k,v)=>{P[k]=v;try{localStorage.ap1=JSON.stringify(P)}catch(e){}};
const items=()=>C.units.filter(u=>!u.soon).flatMap(u=>[...u.lessons.map(l=>'L'+l.id),'T'+u.id]);
function nav(cur){const done=items().filter(i=>P[i]!=null).length,n=items().length;
$('#pr').innerHTML=`${done}/${n} complete<div class=bar><div style="width:${done/n*100}%"></div></div>`;
$('#nav').innerHTML=`<h3 style="font-size:20px">${C.title}</h3><div class=why>${C.sub}</div>`+C.units.map(u=>`<h4>Unit ${u.id} · ${u.title}</h4>`+(u.soon?`<a class=soon>Coming soon</a>`:
u.lessons.map(l=>`<a class="${cur=='L'+l.id?'on':''}" href="#L${l.id}">${l.id} ${l.title}<span class=dot>${P['L'+l.id]!=null?'●':''}</span></a>`).join('')+
`<a class="${cur=='T'+u.id?'on':''}" href="#T${u.id}"><b>Unit ${u.id} test</b><span class=dot>${P['T'+u.id]!=null?P['T'+u.id]+'%':''}</span></a>`)).join('')}
function quiz(qs,done,label){let i=0,s=0;const box=document.createElement('div');
(function show(){if(i>=qs.length){const p=Math.round(s/qs.length*100);box.innerHTML=`<div class=tag>${label}</div><h2>${s}/${qs.length} correct · ${p}%</h2><p>${p>=80?'Strong work.':'Review the lesson and try again.'}</p>`;done(p);return}
const q=qs[i];box.innerHTML=`<div class=tag>${label} · ${i+1} of ${qs.length}</div><h3>${q.q}</h3>`+q.o.map((o,j)=>`<button class=opt data-j=${j}>${'ABCD'[j]}. ${o}</button>`).join('')+`<p class=why id=w></p>`;
box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(box.dataset.l==i)return;box.dataset.l=i;const j=+b.dataset.j;if(j==q.a)s++;
box.querySelectorAll('.opt').forEach(x=>{const k=+x.dataset.j==q.a?'ok':x==b?'bad':null;if(k)x.classList.add(k)});
box.querySelector('#w').innerHTML=q.w+'<br><br><button id=nx>'+(i+1<qs.length?'Next':'Finish')+'</button>';box.querySelector('#nx').onclick=()=>{i++;show()}})})();return box}
function route(){const h=location.hash.slice(1),v=$('#view');window.scrollTo(0,0);nav(h);
if(!h){v.innerHTML=`<div class=tag>Free AP exam prep</div><h1 style="font-size:44px">Learn it. Play with it. Pass the exam.</h1><p style="max-width:540px;color:var(--mute)">Short lessons with live demos, practice mid-lesson, a check after each lesson, and an AP-style test for every unit.</p><button onclick="location.hash='L1.1'">Start ${C.title}</button>`;return}
const t=h[0],id=h.slice(1),u=C.units.find(u=>t=='T'?u.id==id:u.lessons?.some(l=>l.id==id));if(!u||u.soon){location.hash='';return}
if(t=='T'){v.innerHTML=`<div class=tag>Unit ${u.id} test</div><h1>${u.title}</h1><div class=card id=q></div>`;$('#q').append(quiz(u.test,p=>save(h,p),'Unit test'));return}
const l=u.lessons.find(l=>l.id==id),k=u.lessons.indexOf(l),nx=u.lessons[k+1];
v.innerHTML=`<div class=tag>Unit ${u.id} · Lesson ${l.id}</div><h1>${l.title}</h1><div class=card>${l.body}</div>`+(l.demo?`<div class=card><div class=tag>Interactive demo</div><div id=d></div></div>`:'')+`<div class=card id=p></div><div class=card id=c></div><div id=n></div>`;
if(l.demo)DEMOS[l.demo]($('#d'));
const els=[...v.querySelector('.card').children,...[...v.querySelectorAll(':scope > .card')].slice(1)];els.forEach((e,i)=>{if(i)e.style.display='none'});
if(els.length>1){const g=document.createElement('button');g.id='go';g.textContent='Continue ↓';let j=1;g.onclick=()=>{const e=els[j++];e.style.display='';e.classList.add('in');e.querySelector('.sm')?.click();e.scrollIntoView({behavior:'smooth',block:'center'});if(j>=els.length)g.remove()};v.append(g)}
$('#p').append(quiz([l.practice],()=>{},'Practice'));
$('#c').append(quiz(l.check,p=>{save(h,p);$('#n').innerHTML=`<button onclick="location.hash='${nx?'L'+nx.id:'T'+u.id}'">${nx?'Next lesson':'Take the unit test'} →</button>`;nav(h)},'Understanding check'))}
addEventListener('hashchange',route);route();
</script></body></html>
